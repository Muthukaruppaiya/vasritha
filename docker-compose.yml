services:
  postgres:
    image: postgres:16-alpine
    container_name: vasritha-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vasritha
      POSTGRES_PASSWORD: vasritha
      POSTGRES_DB: vasritha
    volumes:
      - vasritha_pg_data:/var/lib/postgresql/data
      - ./db/local/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  vasritha_pg_data:
